<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Helper</title>
<style>
:root{
  --bg:#0f1117; --panel:#171a23; --panel2:#1e2230; --line:#2a2f3f; --text:#e9ecf3; --muted:#8a91a6;
  --us:#4d9bff; --us-soft:rgba(77,155,255,.14); --them:#ff6b6b; --them-soft:rgba(255,107,107,.14);
  --good:#3ddc97; --bad:#ff7a7a; --gold:#ffd166; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:16px 20px 40px}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{font-weight:700;font-size:17px;letter-spacing:.2px;margin-right:6px}
.brand span{color:var(--gold)}
select,.seg button,.btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
select{color:var(--text);min-width:220px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--panel);color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 -2px 0 var(--gold)}
.chip{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.spacer{flex:1}
.btn:hover,.seg button:hover{border-color:#3a4155}
.btn.ghost{background:transparent}
.toggle{display:inline-flex;align-items:center;gap:8px;color:var(--muted);user-select:none;cursor:pointer}
.toggle input{display:none}
.toggle .knob{width:34px;height:20px;border-radius:999px;background:#333a4d;position:relative;transition:.15s}
.toggle .knob::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#cfd5e3;transition:.15s}
.toggle input:checked + .knob{background:var(--us)}
.toggle input:checked + .knob::after{left:17px;background:#fff}
.toggle.disabled{opacity:.4;pointer-events:none}

/* board */
.board{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center}
.team h3{margin:0 0 10px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.team.us h3{color:var(--us)} .team.them h3{color:var(--them);text-align:right}
.slots{display:flex;gap:10px}
.team.them .slots{justify-content:flex-end}
.slot{width:78px;height:78px;border-radius:16px;border:2px dashed #343a4d;display:flex;align-items:center;justify-content:center;position:relative;color:#4b5268;font-size:12px;background:#141720;transition:.15s}
.slot img{width:100%;height:100%;object-fit:cover;border-radius:14px}
.slot.filled{border-style:solid;cursor:pointer}
.team.us .slot.filled{border-color:var(--us)} .team.them .slot.filled{border-color:var(--them)}
.slot.next{border-color:var(--gold);border-style:solid;box-shadow:0 0 0 4px rgba(255,209,102,.12);color:var(--gold)}
.slot .x{position:absolute;inset:0;border-radius:14px;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;font-size:20px;color:#fff}
.slot.filled:hover .x{display:flex}
.slot .lbl{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid{text-align:center;min-width:300px}
.odds{font-size:13px;color:var(--muted);margin-bottom:6px}
.odds b{font-size:22px;color:var(--text)}
.bar{height:8px;border-radius:999px;background:var(--them);overflow:hidden;margin:0 auto 14px;max-width:280px}
.bar div{height:100%;background:var(--us);transition:width .3s}
.bans{display:flex;gap:6px;justify-content:center}
.ban{width:40px;height:40px;border-radius:10px;border:1.5px dashed #343a4d;background:#141720;position:relative;overflow:hidden}
.ban img{width:100%;height:100%;object-fit:cover;filter:grayscale(.7) brightness(.8)}
.ban.filled{border-style:solid;border-color:#555d74;cursor:pointer}
.ban.filled::after{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:2px;background:var(--bad);transform:rotate(-35deg)}
.ban.next{border-color:var(--gold)}
.bans-label{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin:6px 0 0}

/* main */
.main{display:grid;grid-template-columns:minmax(380px,5fr) 6fr;gap:16px;margin-top:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.headline{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.headline h2{margin:0;font-size:20px}
.headline .who{font-size:12px;padding:3px 9px;border-radius:999px;font-weight:600;white-space:nowrap}
.who.us{background:var(--us-soft);color:var(--us)} .who.them{background:var(--them-soft);color:var(--them)} .who.ban{background:rgba(255,209,102,.13);color:var(--gold)}
.sub{color:var(--muted);margin:0 0 14px}
.rec{display:flex;gap:14px;align-items:center;padding:12px;border-radius:12px;background:var(--panel2);border:1px solid transparent;cursor:pointer;margin-bottom:10px;transition:.12s}
.rec:hover{border-color:#3a4155;transform:translateY(-1px)}
.rec img{width:58px;height:58px;border-radius:12px;object-fit:cover;flex:none}
.rec .body{flex:1;min-width:0}
.rec .name{font-weight:650;font-size:16px}
.rec .why{color:#c4c9d6;font-size:13px;margin-top:2px}
.rec .score{text-align:right;flex:none}
.rec .score b{font-size:22px;display:block;line-height:1.1}
.rec .score small{color:var(--muted);font-size:12px}
.rec.top{border-color:rgba(255,209,102,.35);background:linear-gradient(180deg,rgba(255,209,102,.06),var(--panel2))}
.pos{color:var(--good)} .neg{color:var(--bad)}
.also{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.also button{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px}
.also img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.also small{color:var(--muted)}
.details{margin-top:8px;display:none}
.rec.open .details{display:block}
.drow{display:grid;grid-template-columns:150px 1fr 56px;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:3px 0}
.dbar{height:6px;background:#2a2f3f;border-radius:999px;position:relative}
.dbar i{position:absolute;top:0;bottom:0;border-radius:999px}
.dbar::before{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#454c62}
.more{font-size:12px;color:var(--muted);background:none;border:0;padding:0;margin-top:4px;text-decoration:underline dotted}
.section-title{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.empty{color:var(--muted);padding:20px 0;text-align:center}
.err{background:rgba(255,122,122,.1);border:1px solid rgba(255,122,122,.35);color:#ffc2c2;border-radius:10px;padding:10px 12px;margin-bottom:12px}
.final-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.final-row img{width:34px;height:34px;border-radius:8px}
.final-row .v{margin-left:auto;font-variant-numeric:tabular-nums}

/* picker */
.search{width:100%;padding:12px 14px 12px 40px;border-radius:12px;border:1px solid var(--line);background:var(--panel2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="%238a91a6" stroke-width="2"><circle cx="8" cy="8" r="6"/><path d="m13 13 4 4"/></svg>') no-repeat 13px center;color:var(--text);font-size:15px;outline:none}
.search:focus{border-color:var(--gold)}
.pick-hint{font-size:12px;color:var(--muted);margin:8px 2px 10px;display:flex;gap:8px;align-items:center}
.pick-hint .dot{width:8px;height:8px;border-radius:50%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;max-height:calc(100vh - 330px);min-height:260px;overflow:auto;padding:2px}
.b{background:var(--panel2);border:1px solid transparent;border-radius:12px;padding:5px 4px 6px;text-align:center;cursor:pointer;transition:.1s}
.b:hover{border-color:#3a4155}
.b img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;display:block;background:#11141c}
.b span{display:block;font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#cbd0dc}
.b.used{opacity:.22;pointer-events:none}
.b.first{border-color:var(--gold)}
.b.sug{box-shadow:inset 0 0 0 1px rgba(61,220,151,.5)}

/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,92vw);background:var(--panel);border-left:1px solid var(--line);padding:20px;overflow:auto;transform:translateX(100%);transition:.2s;z-index:10}
.drawer.open{transform:none;box-shadow:-20px 0 40px rgba(0,0,0,.4)}
.drawer h3{margin:0 0 4px}
.drawer table{width:100%;border-collapse:collapse;font-size:13px}
.drawer td,.drawer th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}
.drawer th{color:var(--muted);font-weight:500;font-size:12px}
.drawer textarea{width:100%;min-height:170px;background:#11141c;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:13px ui-monospace,Menlo,monospace}
.foot{margin-top:18px;color:#5d6479;font-size:12px;text-align:center}
@media (max-width:980px){
  .main{grid-template-columns:1fr}
  .board{grid-template-columns:1fr;text-align:center}
  .team.them h3{text-align:left} .team.them .slots{justify-content:flex-start}
  .grid{max-height:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Draft <span>Helper</span></div>
    <select id="map" title="Map"></select>
    <div class="seg" id="side">
      <button data-v="1">We pick first</button><button data-v="0">They pick first</button>
    </div>
    <span class="chip" id="bracket">Legendary+</span>
    <div class="spacer"></div>
    <label class="toggle" id="personalWrap" title="Only suggest brawlers you own, and account for your buffies and history">
      <input type="checkbox" id="personal"><span class="knob"></span>Use my brawlers
    </label>
    <button class="btn ghost" id="youBtn" hidden>You</button>
    <button class="btn ghost" id="undo" title="Undo (Backspace)">Undo</button>
    <button class="btn" id="reset">New draft</button>
  </div>

  <div class="board">
    <div class="team us"><h3>Your team</h3><div class="slots" id="usSlots"></div></div>
    <div class="mid">
      <div class="odds" id="odds"></div>
      <div class="bar" id="bar" hidden><div></div></div>
      <div class="bans" id="bans"></div>
      <div class="bans-label">Bans</div>
    </div>
    <div class="team them"><h3>Enemy team</h3><div class="slots" id="themSlots"></div></div>
  </div>

  <div class="main">
    <div class="card" id="advice"></div>
    <div class="card">
      <input class="search" id="q" placeholder="Search brawlers… (e.g. primo, mrp)" autocomplete="off" spellcheck="false">
      <div class="pick-hint" id="hint"></div>
      <div class="grid" id="grid"></div>
    </div>
  </div>
  <div class="foot" id="foot"></div>
</div>

<div class="drawer" id="drawer">
  <div style="display:flex;align-items:center"><h3>You</h3><div class="spacer"></div><button class="btn ghost" id="closeDrawer">Close</button></div>
  <p class="sub" id="youSummary"></p>
  <div class="section-title">Your best brawlers (vs. what the model expected)</div>
  <div id="youTop"></div>
  <div class="section-title">Missing buffies</div>
  <p class="sub" style="margin-bottom:8px">One brawler per line. Everything else with buffies counts as fully built. Only affects <em>your</em> picks when "Use my brawlers" is on.</p>
  <textarea id="buffies" spellcheck="false"></textarea>
  <div style="margin-top:8px;display:flex;gap:10px;align-items:center"><button class="btn" id="saveBuffies">Save</button><span id="buffiesMsg" class="sub" style="margin:0"></span></div>
</div>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, "");
const MODE = {brawlBall:"Brawl Ball", gemGrab:"Gem Grab", knockout:"Knockout", bounty:"Bounty", heist:"Heist", hotZone:"Hot Zone"};
const ORDER = [0,1,1,0,0,1];          // 0 = first-pick team

// ---------------------------------------------------------------- state
const S = {
  meta: null, byId: {}, brawlers: [], maps: [], bracket: "legendary", personalAvail: false,
  d: load() || fresh(), resp: null, err: null, open: {}, ctl: null, timer: null
};
function fresh(){ return {mapKey: null, weFirst: true, personal: false, bans: [], picks: [], phase: "bans", hist: []}; }
function load(){ try{ return JSON.parse(localStorage.getItem("draft-v2")); }catch(e){ return null; } }
function save(){ localStorage.setItem("draft-v2", JSON.stringify(S.d)); }
const D = () => S.d;
const ours = () => D().picks.filter(p => p.us).map(p => p.id);
const theirs = () => D().picks.filter(p => !p.us).map(p => p.id);
const used = () => new Set([...D().bans, ...D().picks.map(p => p.id)]);
function teamAt(step){ return (ORDER[step] === 0) === D().weFirst; }      // true = us
function phase(){ return D().picks.length >= 6 ? "done" : (D().phase === "bans" && D().picks.length === 0 ? "bans" : "picks"); }
const img = id => (S.byId[id] && S.byId[id].image) || "";
const nm = id => (S.byId[id] && S.byId[id].name) || ("#" + id);
const pct = (v, d=0) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d) + "%";

// ---------------------------------------------------------------- actions
function snapshot(){ D().hist.push(JSON.stringify({bans: D().bans, picks: D().picks, phase: D().phase})); if(D().hist.length > 60) D().hist.shift(); }
function choose(id){
  if(used().has(id)) return;
  const ph = phase();
  if(ph === "done") return;
  snapshot();
  if(ph === "bans"){
    D().bans.push(id);
    if(D().bans.length >= 6) D().phase = "picks";
  } else {
    D().picks.push({id, us: teamAt(D().picks.length)});
  }
  $("#q").value = ""; changed();
}
function removeBan(id){ snapshot(); D().bans = D().bans.filter(b => b !== id); if(!D().picks.length) D().phase = "bans"; changed(); }
function removePick(id){
  const i = D().picks.findIndex(p => p.id === id);
  if(i < 0) return;
  snapshot(); D().picks = D().picks.slice(0, i);      // later picks depend on this one
  changed();
}
function undo(){ const h = D().hist.pop(); if(!h) return; Object.assign(D(), JSON.parse(h)); changed(); }
function reset(){ const keep = {mapKey: D().mapKey, weFirst: D().weFirst, personal: D().personal}; S.d = Object.assign(fresh(), keep); changed(); }
function changed(){ save(); renderBoard(); renderGrid(); schedule(); }

// ---------------------------------------------------------------- data
async function init(){
  const r = await fetch("/api/meta?bracket=" + S.bracket);
  if(!r.ok){ $("#advice").innerHTML = '<div class="err">The model isn\'t ready. Run <code>.venv/bin/python train.py</code>, then reload.</div>'; return; }
  S.meta = await r.json();
  S.brawlers = S.meta.brawlers; S.byId = {}; S.brawlers.forEach(b => S.byId[b.id] = b);
  S.maps = S.meta.maps; S.personalAvail = !!S.meta.personal_available;
  // map select grouped by mode
  const byMode = {};
  S.maps.forEach(m => (byMode[m.mode] = byMode[m.mode] || []).push(m));
  $("#map").innerHTML = Object.keys(byMode).sort((a,b) => (MODE[a]||a).localeCompare(MODE[b]||b)).map(mo =>
    '<optgroup label="' + esc(MODE[mo] || mo) + '">' + byMode[mo].sort((a,b) => a.map.localeCompare(b.map)).map(m =>
      '<option value="' + esc(mo + "|" + m.map) + '">' + esc(m.map) + '</option>').join("") + '</optgroup>').join("");
  const keys = S.maps.map(m => m.mode + "|" + m.map);
  if(!keys.includes(D().mapKey)){ const best = S.maps.slice().sort((a,b) => b.games - a.games)[0]; D().mapKey = best.mode + "|" + best.map; }
  $("#map").value = D().mapKey;
  const lab = (S.meta.brackets.find(b => b.id === S.bracket) || {}).label || "Legendary+";
  $("#bracket").textContent = lab;
  $("#personalWrap").classList.toggle("disabled", !S.personalAvail);
  if(!S.personalAvail) D().personal = false;
  $("#personal").checked = D().personal;
  $("#youBtn").hidden = !S.personalAvail;
  const dt = new Date(S.meta.model.trained_through * 1000);
  $("#foot").textContent = `${lab} games since the Nov 3 patch · ${S.meta.model.n_in_bracket.toLocaleString()} games · data through ${dt.toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"})}. Win chances assume equal skill.`;
  renderSide(); renderBoard(); renderGrid(); schedule();
}
function schedule(){ clearTimeout(S.timer); S.timer = setTimeout(fetchRecs, 60); }
async function fetchRecs(){
  if(!S.meta) return;
  if(S.ctl) S.ctl.abort();
  S.ctl = new AbortController();
  const [mode, map] = D().mapKey.split("|");
  const body = {map, mode, we_first: D().weFirst, bans: D().bans, our: ours(), opp: theirs(),
                personal: D().personal && S.personalAvail, bracket: S.bracket, top: 5};
  try{
    const r = await fetch("/api/recommend", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body), signal: S.ctl.signal});
    const d = await r.json();
    if(!r.ok){ S.err = d.detail || ("Error " + r.status); S.resp = null; }
    else { S.err = null; S.resp = d; }
  }catch(e){ if(e.name === "AbortError") return; S.err = "Can't reach the server. Is server.py running?"; S.resp = null; }
  renderAdvice(); renderOdds(); renderGrid();
}

// ---------------------------------------------------------------- board
function renderSide(){ document.querySelectorAll("#side button").forEach(b => b.classList.toggle("on", (b.dataset.v === "1") === D().weFirst)); }
function slotsFor(us){
  const steps = [0,1,2,3,4,5].filter(s => teamAt(s) === us);
  const picks = D().picks.map((p, i) => ({...p, step: i})).filter(p => p.us === us);
  const nextStep = phase() === "picks" ? D().picks.length : -1;
  return steps.map((s, k) => {
    const p = picks[k];
    if(p) return `<div class="slot filled" data-pick="${p.id}" title="Remove ${esc(nm(p.id))}"><img src="${esc(img(p.id))}" alt=""><div class="x">✕</div><div class="lbl">${esc(nm(p.id))}</div></div>`;
    return `<div class="slot ${s === nextStep ? "next" : ""}">${s === nextStep ? "now" : "pick " + (s + 1)}</div>`;
  }).join("");
}
function renderBoard(){
  $("#usSlots").innerHTML = slotsFor(true);
  $("#themSlots").innerHTML = slotsFor(false);
  const bans = D().bans, ph = phase();
  let h = "";
  for(let i = 0; i < 6; i++){
    const id = bans[i];
    h += id ? `<div class="ban filled" data-ban="${id}" title="Unban ${esc(nm(id))}"><img src="${esc(img(id))}" alt=""></div>`
            : `<div class="ban ${ph === "bans" && i === bans.length ? "next" : ""}"></div>`;
  }
  $("#bans").innerHTML = h;
  renderOdds(); renderHint();
}
function renderOdds(){
  const n = D().picks.length, r = S.resp;
  if(!n || !r){ $("#odds").innerHTML = ph_text(); $("#bar").hidden = true; return; }
  const p = r.final ? r.final.win_prob : r.current_win_prob;
  $("#odds").innerHTML = `<b>${Math.round(p)}%</b> chance to win ${r.final ? "" : "with the picks so far"}`;
  $("#bar").hidden = false; $("#bar div").style.width = p + "%";
}
function ph_text(){ return phase() === "bans" ? "Enter bans, then picks. Suggestions update as you go." : ""; }
function renderHint(){
  const ph = phase();
  let t;
  if(ph === "bans") t = `<span class="dot" style="background:var(--gold)"></span>Clicking a brawler <b>bans</b> it. <button class="btn" id="startPicks" style="padding:3px 10px;margin-left:auto">Start picks →</button>`;
  else if(ph === "done") t = `Draft complete. Click a pick to change it, or start a new draft.`;
  else { const us = teamAt(D().picks.length);
    t = `<span class="dot" style="background:var(${us ? "--us" : "--them"})"></span>Clicking a brawler adds it to <b style="color:var(${us ? "--us" : "--them"})">${us ? "your team" : "the enemy team"}</b> (pick ${D().picks.length + 1} of 6)`; }
  $("#hint").innerHTML = t;
  const sp = $("#startPicks"); if(sp) sp.onclick = () => { snapshot(); D().phase = "picks"; changed(); };
}

// ---------------------------------------------------------------- picker + search
function score(b, q){
  if(!q) return 1;
  const n = norm(b.name);
  if(n === q) return 100;
  if(n.startsWith(q)) return 80;
  const words = b.name.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
  if(words.some(w => w.startsWith(q))) return 60;
  if(n.includes(q)) return 40;
  // letters in order (e.g. "ltr" -> "Larry & Lawrie"), only for 3+ chars
  if(q.length >= 3){ let i = 0; for(const c of n){ if(c === q[i]) i++; if(i === q.length) return 10; } }
  return 0;
}
function filtered(){
  const q = norm($("#q").value);
  const arr = S.brawlers.map(b => ({b, s: score(b, q)})).filter(x => x.s > 0);
  if(q) arr.sort((a, b) => b.s - a.s || a.b.name.localeCompare(b.b.name));
  return arr.map(x => x.b);
}
function suggestedIds(){
  const r = S.resp; if(!r) return new Set();
  const list = phase() === "bans" ? ((r.ban_recs && r.ban_recs.bans) || [])
             : (r.pick_recs && r.pick_recs.picks) || r.opponent_prediction || [];
  return new Set(list.slice(0, 3).map(x => x.brawler_id));
}
function renderGrid(){
  if(!S.meta) return;
  const u = used(), sug = suggestedIds(), list = filtered(), q = $("#q").value.trim();
  const firstFree = list.find(b => !u.has(b.id));
  $("#grid").innerHTML = list.length ? list.map(b =>
    `<div class="b ${u.has(b.id) ? "used" : ""} ${q && firstFree && b.id === firstFree.id ? "first" : ""} ${sug.has(b.id) ? "sug" : ""}" data-id="${b.id}" title="${esc(b.name)}">
       <img loading="lazy" src="${esc(b.image || "")}" alt="" onerror="this.style.visibility='hidden'"><span>${esc(b.name)}</span></div>`).join("")
    : `<div class="empty" style="grid-column:1/-1">No brawler matches "${esc(q)}"</div>`;
}

// ---------------------------------------------------------------- advice (plain-English)
function reasonsFor(r, last){
  const b = r.breakdown_pct || {}, y = r.you_info || {}, out = [];
  if(b.map_strength >= 3) out.push("strong on this map");
  else if(b.map_strength <= -2) out.push("weak on this map");
  if(b.counters >= 1) out.push("good into their picks");
  else if(b.counters <= -1) out.push("struggles into their picks");
  if(b.synergy >= 1) out.push("fits your team well");
  else if(b.synergy <= -1) out.push("awkward with your team");
  if(last) out.push("nothing left to counter it");
  else if(b.risk_countered >= 0.5) out.push("hard to counter");
  else if(b.risk_countered <= -1) out.push("easy to counter, so risky this early");
  if(y.games >= 3 && y.me_pct >= 0.5) out.push(`you do well on it (${y.games} games, ${Math.round(y.wr)}%)`);
  if(y.games >= 3 && y.me_pct <= -0.5) out.push(`you've struggled on it (${y.games} games, ${Math.round(y.wr)}%)`);
  if(y.buffie_pct) out.push(`you're missing buffies (${pct(y.buffie_pct, 0)})`);
  if(y.power_pct) out.push(`only power ${y.power}`);
  if(r.games_on_map < 30) out.push("not much data here yet");
  if(!out.length) out.push("solid all-round option");
  const s = out.join(", ");
  return s.charAt(0).toUpperCase() + s.slice(1) + ".";
}
function detailRows(r){
  const b = r.breakdown_pct || {};
  const rows = [["On this map", b.map_strength], ["With your team", b.synergy], ["Vs. their picks", b.counters], ["Vs. their next picks", b.risk_countered]];
  if(b.you !== undefined) rows.push(["You", b.you]);
  return rows.map(([k, v]) => {
    v = v || 0; const w = Math.min(50, Math.abs(v) * 5);
    return `<div class="drow"><span>${k}</span><div class="dbar"><i style="${v >= 0 ? `left:50%;width:${w}%;background:var(--good)` : `right:50%;width:${w}%;background:var(--bad)`}"></i></div><span class="${v >= 0.05 ? "pos" : v <= -0.05 ? "neg" : ""}" style="text-align:right">${pct(v, 1)}</span></div>`;
  }).join("") + `<div class="drow"><span>Picked here</span><span>${Math.round(r.pick_rate)}% of games · ${r.games_on_map.toLocaleString()} games on this map</span><span></span></div>`;
}
function recCard(r, i, last){
  const key = "p" + r.brawler_id;
  return `<div class="rec ${i === 0 ? "top" : ""} ${S.open[key] ? "open" : ""}" data-choose="${r.brawler_id}">
    <img src="${esc(img(r.brawler_id))}" alt="">
    <div class="body"><div class="name">${esc(r.name)}</div><div class="why">${esc(reasonsFor(r, last))}</div>
      <button class="more" data-toggle="${key}">${S.open[key] ? "Hide details" : "Why?"}</button>
      <div class="details">${detailRows(r)}</div></div>
    <div class="score"><b>${Math.round(r.win_prob)}%</b><small class="${r.delta_vs_typical >= 0 ? "pos" : "neg"}">${pct(r.delta_vs_typical, 1)} vs usual pick</small></div>
  </div>`;
}
function banCard(r, i){
  const bits = [];
  if(r.pick_rate >= 15) bits.push(`picked in ${Math.round(r.pick_rate)}% of games here`);
  if(r.map_strength_pct >= 2) bits.push("strong on this map");
  if(r.opp_first_choice_prob >= 6) bits.push("a likely first choice for them");
  if(!bits.length) bits.push("takes away a good option for them");
  const s = bits.join(", ");
  return `<div class="rec ${i === 0 ? "top" : ""}" data-choose="${r.brawler_id}">
    <img src="${esc(img(r.brawler_id))}" alt="">
    <div class="body"><div class="name">${esc(r.name)}</div><div class="why">${esc(s.charAt(0).toUpperCase() + s.slice(1))}.</div></div>
    <div class="score"><b class="pos">${pct(r.delta_win_prob, 1)}</b><small>your win chance</small></div></div>`;
}
function also(list, fmt){
  if(!list.length) return "";
  return `<div class="section-title">Also good</div><div class="also">` + list.map(r =>
    `<button data-choose="${r.brawler_id}"><img src="${esc(img(r.brawler_id))}" alt="">${esc(r.name)} <small>${fmt(r)}</small></button>`).join("") + `</div>`;
}
function renderAdvice(){
  const el = $("#advice"), r = S.resp, ph = phase();
  if(S.err){ el.innerHTML = `<div class="err">${esc(S.err)}</div>`; return; }
  if(!r){ el.innerHTML = `<div class="empty">Thinking…</div>`; return; }
  const [mode, map] = D().mapKey.split("|");
  let h = "";
  if(ph === "bans"){
    const yourPickFirst = D().weFirst ? "You pick first, so you can also just take the best brawler yourself." : "They pick first, so ban what they'd grab.";
    h += `<div class="headline"><h2>Who to ban</h2><span class="who ban">Ban phase</span></div><p class="sub">${esc(map)} · ${esc(MODE[mode] || mode)}. ${yourPickFirst}</p>`;
    const bans = (r.ban_recs && r.ban_recs.bans) || [];
    h += bans.slice(0, 3).map(banCard).join("") || `<div class="empty">No ban suggestions.</div>`;
    h += also(bans.slice(3), x => pct(x.delta_win_prob, 1));
    if(r.pick_recs){
      const p = r.pick_recs.picks.slice(0, 3);
      h += `<div class="section-title">Best first picks if they're open</div><div class="also">` + p.map(x =>
        `<span class="chip" style="display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px"><img src="${esc(img(x.brawler_id))}" style="width:24px;height:24px;border-radius:50%">${esc(x.name)} ${Math.round(x.win_prob)}%</span>`).join("") + `</div>`;
    }
  } else if(ph === "done"){
    const f = r.final;
    h += `<div class="headline"><h2>Draft done</h2></div><p class="sub">Your comp's chance to win: <b style="color:var(--text);font-size:18px">${Math.round(f.win_prob)}%</b> (equal skill)</p>`;
    const row = x => { const t = x.strength + x.synergy + x.counters;
      return `<div class="final-row"><img src="${esc(img(x.brawler_id))}" alt=""><span>${esc(nm(x.brawler_id))}</span><span class="v ${t >= 0 ? "pos" : "neg"}">${pct(t, 1)}</span></div>`; };
    h += `<div class="section-title">Your team's impact</div>` + f.ours.map(row).join("");
    h += `<div class="section-title">Their team's impact</div>` + f.theirs.map(row).join("");
  } else if(r.turn === "us"){
    const n = D().picks.length, last = n === 5;
    const title = n === 0 ? "Your first pick" : last ? "Your last pick" : "Your pick";
    const sub = n === 0 ? "Blind pick: these hold up well whatever they pick next." : last ? "Nothing left to answer this pick, so go for the best counter." : "Balances map strength, your team, and what they can still pick.";
    h += `<div class="headline"><h2>${title}</h2><span class="who us">You're up</span></div><p class="sub">${sub}${D().personal ? " Showing brawlers you own." : ""}</p>`;
    const p = r.pick_recs.picks;
    h += p.slice(0, 3).map((x, i) => recCard(x, i, last)).join("");
    h += also(p.slice(3), x => Math.round(x.win_prob) + "%");
  } else {
    h += `<div class="headline"><h2>They're picking</h2><span class="who them">Enemy turn</span></div><p class="sub">Click what they picked. Most likely:</p>`;
    h += (r.opponent_prediction || []).map(x =>
      `<div class="rec" data-choose="${x.brawler_id}" style="padding:8px 12px"><img src="${esc(img(x.brawler_id))}" style="width:40px;height:40px" alt=""><div class="body"><div class="name" style="font-size:14px">${esc(x.name)}</div>
       <div class="dbar" style="margin-top:6px;max-width:220px"><i style="left:0;width:${Math.min(100, x.prob * 3)}%;background:var(--them)"></i></div></div><div class="score"><b style="font-size:16px">${Math.round(x.prob)}%</b></div></div>`).join("");
  }
  el.innerHTML = h;
}

// ---------------------------------------------------------------- "You" drawer
async function openDrawer(){
  $("#drawer").classList.add("open");
  try{
    const [st, bf] = await Promise.all([fetch("/api/my_stats?bracket=" + S.bracket).then(r => r.json()), fetch("/api/my_buffies").then(r => r.json())]);
    $("#buffies").value = bf.text || "";
    if(!st.available){ $("#youSummary").textContent = "No personal data yet."; return; }
    $("#youSummary").textContent = `${(st.rank || "").replace(/\b\w/g, c => c.toUpperCase()).replace(/\B\w/g, c => c.toLowerCase())} · ${st.n_games} recent games tracked (${st.n_ranked} ranked). Your history grows as the crawler saves your battles.`;
    const rows = (st.top || []).concat(st.bottom || []).filter(x => x.games >= 1);
    $("#youTop").innerHTML = rows.length ? `<table><tr><th>Brawler</th><th>Games</th><th>Win rate</th><th>Expected</th><th>You</th></tr>` +
      rows.map(x => `<tr><td>${esc(x.name)}</td><td>${x.games}</td><td>${Math.round(x.wr)}%</td><td style="color:var(--muted)">${Math.round(x.expected_wr)}%</td><td class="${x.me_factor_pct >= 0 ? "pos" : "neg"}">${pct(x.me_factor_pct, 1)}</td></tr>`).join("") + `</table>`
      : `<p class="sub">Not enough games yet.</p>`;
  }catch(e){ $("#youSummary").textContent = "Couldn't load your stats."; }
}
async function saveBuffies(){
  const msg = $("#buffiesMsg"); msg.textContent = "Saving…"; msg.className = "sub";
  const r = await fetch("/api/my_buffies", {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify({text: $("#buffies").value})});
  const d = await r.json();
  if(!r.ok){ msg.textContent = d.detail || "Couldn't save."; msg.className = "neg"; return; }
  msg.textContent = "Saved."; msg.className = "pos"; schedule();
}

// ---------------------------------------------------------------- events
$("#map").onchange = e => { D().mapKey = e.target.value; save(); schedule(); };
$("#side").onclick = e => { const b = e.target.closest("button"); if(!b) return;
  const wf = b.dataset.v === "1"; if(wf === D().weFirst) return;
  D().weFirst = wf; D().picks = []; D().hist = []; renderSide(); changed(); };
$("#personal").onchange = e => { D().personal = e.target.checked; save(); schedule(); };
$("#undo").onclick = undo;
$("#reset").onclick = reset;
$("#youBtn").onclick = openDrawer;
$("#closeDrawer").onclick = () => $("#drawer").classList.remove("open");
$("#saveBuffies").onclick = saveBuffies;
$("#buffies").addEventListener("keydown", e => e.stopPropagation());
$("#q").addEventListener("input", renderGrid);
$("#q").addEventListener("keydown", e => {
  if(e.key === "Enter"){ const u = used(); const f = filtered().find(b => !u.has(b.id)); if(f) choose(f.id); e.preventDefault(); }
  else if(e.key === "Escape"){ e.target.value = ""; renderGrid(); }
  else if(e.key === "Backspace" && !e.target.value){ undo(); e.preventDefault(); }
});
document.addEventListener("keydown", e => {
  if(e.metaKey || e.ctrlKey || e.altKey) { if((e.metaKey || e.ctrlKey) && e.key === "z"){ undo(); e.preventDefault(); } return; }
  const tag = (document.activeElement || {}).tagName;
  if(tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  if(e.key.length === 1 && /[\w\- .&]/.test(e.key)){ $("#q").focus(); }
  else if(e.key === "Backspace"){ undo(); e.preventDefault(); }
  else if(e.key === "Escape"){ $("#drawer").classList.remove("open"); }
});
document.addEventListener("click", e => {
  const t = e.target.closest("[data-toggle]");
  if(t){ e.stopPropagation(); S.open[t.dataset.toggle] = !S.open[t.dataset.toggle]; renderAdvice(); return; }
  const c = e.target.closest("[data-choose]"); if(c){ choose(+c.dataset.choose); return; }
  const g = e.target.closest(".b[data-id]"); if(g){ choose(+g.dataset.id); return; }
  const p = e.target.closest("[data-pick]"); if(p){ removePick(+p.dataset.pick); return; }
  const bn = e.target.closest("[data-ban]"); if(bn){ removeBan(+bn.dataset.ban); return; }
});
init();
})();
</script>
</body>
