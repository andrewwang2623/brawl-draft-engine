# Brawler role tags: used by the model (role-vs-role counter and role+role synergy terms,
# which per-pair counters/synergy shrink toward), for comp notes in explanations
# ("Their 3 divers hard-counter your 3 throwers"), and by checks/matchups.yaml role checks.
# In-game (Brawlify) classes are NOT used for this any more; they're UI filters only.
#
# Tags (several per brawler allowed; a brawler's weight is split evenly across its tags):
#   assassin    assassin / diver: closes distance fast to kill backliners
#   thrower     lobs attacks over walls (artillery)
#   sniper      long-range poke / marksman
#   tank        tank / frontline: high HP, wins close fights, holds space
#   controller  area denial: zones, slows, pulls, turrets, mines
#   support     healer / buffer / utility
#   wall_breaker  reliably destroys walls (super / gadget / attack)
#   mid_dps     mid-range damage dealer
#
# Pre-filled by the engine from Brawlify classes, Legendary+ pick patterns (learned range,
# which maps a brawler is picked on) and common game knowledge. confidence: low = please
# check; medium = probably right; high = clear-cut. Edit freely and retrain
# (.venv/bin/python train.py). Names must match meta/brawlers.json.

