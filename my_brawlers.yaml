# Personal brawler state. Used ONLY in personal mode, and only for YOUR pick recommendations.
# Teammates and enemies are always assumed fully built. With personal mode off, everything
# is assumed maxed.
#
# WHICH brawlers you're missing buffies on comes from reference/my_buffies.txt (editable in
# the UI's "My stats" panel). If that file exists, it's authoritative: listed brawlers are missing
# buffies (which ones: from the API's /players buffie flags when available, else all three), and
# every other brawler is fully built.
#
# Fallback when my_buffies.txt doesn't exist: API detection, plus these overrides.
use_api_buffies: true
missing_buffies: []
assume_full: []

# Win-% penalty for missing ALL buffies on a brawler; scaled by the fraction missing.
# The battlelog has no buffie/gear info for other players, so this can't be estimated
# from data. It's a configured, moderate guess.
buffie_penalty_pct: 3.0
