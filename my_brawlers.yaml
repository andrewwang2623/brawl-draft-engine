# Personal brawler state. Used ONLY in personal mode, and only for YOUR pick recommendations.
# Teammates and enemies are always assumed fully built. With personal mode off, everything
# is assumed maxed.
#
# Buffies are read automatically from your profile (BRAWL_PLAYER_TAG) via the official API:
# /players/{tag} -> brawlers[].buffies {gadget, starPower, hyperCharge}. Only brawlers that
# actually have buffies in the game count (inferred from top players' profiles; see
# meta/buffies_available.json). Entries below override the API.

use_api_buffies: true

# Force "missing all buffies" (from the user, 2026-11-04):
missing_buffies:
  - Gale
  - Mr. P
  - Lou
  - Berry
  - Mandy
  - Chester

# Treat as fully built even if the API says buffies are missing:
assume_full: []

# Win-% penalty for missing ALL buffies on a brawler; scaled by the fraction missing.
# The battlelog has no buffie/gear info for other players, so this can't be estimated
# from data. It's a configured, moderate guess.
buffie_penalty_pct: 3.0
